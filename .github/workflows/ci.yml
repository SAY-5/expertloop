name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expertloop
          POSTGRES_PASSWORD: expertloop
          POSTGRES_DB: expertloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expertloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPERTLOOP_TEST_DATABASE_URL: postgresql+psycopg://expertloop:expertloop@localhost:5432/expertloop_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
